# Un solo servicio: PHP + Composer + Node/Vite + Vue (sin imagen node:* aparte).
name: task-manager-advanced

services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-9080}:8000"
      - "${VITE_PORT:-5174}:${VITE_PORT:-5174}"
    volumes:
      - type: bind
        source: ${TASK_MANAGER_PROJECT_ROOT:-.}
        target: /var/www/html
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "http://localhost:${APP_PORT:-9080}"
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_PORT:-5174}"
      VITE_DEV_SERVER_HOST: "0.0.0.0"
      VITE_DOCKER: "1"
      VITE_PORT: "${VITE_PORT:-5174}"
